name: Backend-only legacy tests

permissions:
  contents: read

on:
  push:
    branches:
      - backend/pdf-redaction-verification
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest httpx
      - name: Run synthetic tests
        run: python -m pytest backend/tests -v

      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('backend/static/index.html').read_text()
          assert html.count('<script>') == 1
          script = html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/shareshield-ui.js').write_text(script)
          PY
          node --check /tmp/shareshield-ui.js
